<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Grafo de tareas de Gradle: compileKotlin produce las clases; run las ejecuta; jar las empaqueta; compileTestKotlin compila los tests usando las clases y test los ejecuta; build depende de jar y de test">
  <title>Las tareas de Gradle dependen unas de otras</title>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  </defs>
  <rect width="900" height="330" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Las tareas de Gradle dependen unas de otras</text>
  <text x="450" y="58" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Pides una tarea; Gradle ejecuta antes todas las que necesita, y se salta las que ya están al día</text>

  <rect x="30" y="140" width="170" height="54" rx="8" fill="#161b22" stroke="#7f52ff" stroke-width="2"/>
  <text x="115" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">compileKotlin</text>
  <text x="115" y="182" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">src/main → .class</text>

  <rect x="290" y="80" width="170" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="375" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">run</text>
  <text x="375" y="122" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">ejecuta main()</text>

  <rect x="290" y="160" width="170" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="375" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">jar</text>
  <text x="375" y="202" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">empaqueta en build/libs</text>

  <rect x="290" y="240" width="170" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="375" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">compileTestKotlin</text>
  <text x="375" y="282" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">src/test → .class</text>

  <rect x="530" y="240" width="150" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="605" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3fb950">test</text>
  <text x="605" y="282" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">ejecuta los tests</text>

  <rect x="740" y="190" width="130" height="54" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="805" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e3b341">build</text>
  <text x="805" y="232" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">todo lo anterior</text>

  <line x1="200" y1="160" x2="286" y2="112" stroke="#58a6ff" stroke-width="2" marker-end="url(#c)"/>
  <line x1="200" y1="172" x2="286" y2="185" stroke="#58a6ff" stroke-width="2" marker-end="url(#c)"/>
  <line x1="200" y1="184" x2="286" y2="258" stroke="#58a6ff" stroke-width="2" marker-end="url(#c)"/>
  <line x1="460" y1="267" x2="526" y2="267" stroke="#58a6ff" stroke-width="2" marker-end="url(#c)"/>
  <line x1="460" y1="187" x2="736" y2="212" stroke="#58a6ff" stroke-width="2" marker-end="url(#c)"/>
  <line x1="680" y1="260" x2="736" y2="230" stroke="#58a6ff" stroke-width="2" marker-end="url(#c)"/>
</svg>
