<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Hello.kt pasa por kotlinc y se convierte en HelloKt.class con bytecode; la JVM del JDK lee ese bytecode y lo ejecuta en cualquier sistema operativo">
  <title>Del código fuente a la JVM</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  </defs>
  <rect width="900" height="340" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Del código fuente a la JVM</text>

  <rect x="30" y="70" width="190" height="120" rx="10" fill="#161b22" stroke="#7f52ff" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#a98bff">Código fuente</text>
  <text x="125" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">Hello.kt</text>
  <text x="125" y="150" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">texto que escribes tú</text>
  <text x="125" y="170" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">y que lee una persona</text>

  <line x1="220" y1="130" x2="300" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="95" width="120" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="360" y="125" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0f6fc">kotlinc</text>
  <text x="360" y="147" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">compilador</text>
  <line x1="420" y1="130" x2="490" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="490" y="70" width="190" height="120" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="585" y="98" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0883e">Bytecode</text>
  <text x="585" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">HelloKt.class</text>
  <text x="585" y="150" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">instrucciones para la JVM,</text>
  <text x="585" y="170" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">no para tu procesador</text>

  <line x1="680" y1="130" x2="730" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <rect x="730" y="70" width="140" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="800" y="98" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">JVM</text>
  <text x="800" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#f0f6fc">java</text>
  <text x="800" y="150" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">ejecuta y</text>
  <text x="800" y="170" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">traduce al vuelo</text>

  <rect x="30" y="225" width="840" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="252" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">El mismo .class corre en cualquier sistema que tenga una JVM:</text>
  <rect x="50" y="268" width="240" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="170" y="289" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Linux (tu contenedor)</text>
  <rect x="330" y="268" width="240" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="450" y="289" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Windows</text>
  <rect x="610" y="268" width="240" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="730" y="289" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">macOS</text>
</svg>
