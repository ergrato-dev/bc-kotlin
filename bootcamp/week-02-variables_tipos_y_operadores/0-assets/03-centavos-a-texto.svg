<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="4505 centavos: dividido entre 100 da 45; el resto entre 100 da 5, que se convierte a texto y se rellena a dos dígitos como 05; unidos con un punto dan 45.05. Sin el relleno saldría 45.5">
  <title>De centavos a texto</title>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
  <rect width="900" height="500" fill="#0d1117"/>
  <text x="450" y="34" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#f0f6fc">De centavos a texto: 4505 se muestra como 45.05</text>
  <rect x="350" y="60" width="200" height="50" rx="8" fill="#161b22" stroke="#7f52ff" stroke-width="2"/>
  <text x="450" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle" fill="#f0f6fc">totalCents = 4505L</text>
  <line x1="410" y1="110" x2="240" y2="160" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
  <line x1="490" y1="110" x2="660" y2="160" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
  <rect x="110" y="162" width="240" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="230" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle" fill="#f0f6fc">4505 / 100  da  45</text>
  <rect x="550" y="162" width="240" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="670" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle" fill="#f0f6fc">4505 % 100  da  5</text>
  <text x="230" y="232" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" fill="#8b949e">cuántas veces cabe 100</text>
  <text x="670" y="232" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" fill="#8b949e">lo que sobra: los centavos</text>
  <line x1="670" y1="240" x2="670" y2="272" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
  <rect x="510" y="274" width="320" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="670" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" fill="#f0f6fc">toString().padStart(2, '0')</text>
  <text x="670" y="346" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" fill="#8b949e">5 pasa a 05: siempre dos dígitos</text>
  <line x1="230" y1="240" x2="400" y2="384" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
  <line x1="670" y1="354" x2="500" y2="384" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
  <rect x="310" y="386" width="280" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="418" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" text-anchor="middle" fill="#3fb950">se unen con un punto: 45.05</text>
  <text x="450" y="470" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#f85149">Sin padStart saldría 45.5: otro importe.</text>
</svg>
