<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" role="img" aria-label="Byte, Short, Int y Long ocupan 8, 16, 32 y 64 bits; Float y Double ocupan 32 y 64 y son aproximados. Int, Long y Double son los de uso habitual. Pasar de un tipo a otro siempre es explícito con toInt, toLong o toDouble">
  <title>Tipos numéricos de Kotlin</title>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
  <rect width="900" height="472" fill="#0d1117"/>
  <text x="450" y="34" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#f0f6fc">Tipos numéricos de Kotlin</text>
  <text x="40" y="72" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#f0f6fc">Enteros</text>
  <text x="630" y="72" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="start" fill="#8b949e">Literal</text>
  <text x="750" y="72" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="start" fill="#8b949e">Conversión</text>
  <rect x="40" y="86" width="820" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#f0f6fc">Byte</text>
  <rect x="130" y="98" width="20" height="16" rx="8" fill="#30363d" stroke="none" stroke-width="1"/>
  <text x="160" y="112" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#8b949e">8 bits</text>
  <text x="380" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">-128 … 127</text>
  <text x="630" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">(no tiene)</text>
  <text x="750" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#3fb950">toByte()</text>
  <rect x="40" y="136" width="820" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#f0f6fc">Short</text>
  <rect x="130" y="148" width="40" height="16" rx="8" fill="#30363d" stroke="none" stroke-width="1"/>
  <text x="180" y="162" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#8b949e">16 bits</text>
  <text x="380" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">-32 768 … 32 767</text>
  <text x="630" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">(no tiene)</text>
  <text x="750" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#3fb950">toShort()</text>
  <rect x="40" y="186" width="820" height="40" rx="8" fill="#161b22" stroke="#7f52ff" stroke-width="2"/>
  <text x="56" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#a98bff">Int</text>
  <rect x="130" y="198" width="80" height="16" rx="8" fill="#58a6ff" stroke="none" stroke-width="1"/>
  <text x="220" y="212" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#8b949e">32 bits</text>
  <text x="380" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">-2 147 483 648 … 2 147 483 647</text>
  <text x="630" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">42</text>
  <text x="750" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#3fb950">toInt()</text>
  <rect x="40" y="236" width="820" height="40" rx="8" fill="#161b22" stroke="#7f52ff" stroke-width="2"/>
  <text x="56" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#a98bff">Long</text>
  <rect x="130" y="248" width="160" height="16" rx="8" fill="#58a6ff" stroke="none" stroke-width="1"/>
  <text x="300" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#8b949e">64 bits</text>
  <text x="380" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">± 9 223 372 036 854 775 807</text>
  <text x="630" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">42L</text>
  <text x="750" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#3fb950">toLong()</text>
  <text x="40" y="308" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#f0f6fc">Decimales</text>
  <rect x="40" y="322" width="820" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#f0f6fc">Float</text>
  <rect x="130" y="334" width="80" height="16" rx="8" fill="#30363d" stroke="none" stroke-width="1"/>
  <text x="220" y="348" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#8b949e">32 bits</text>
  <text x="380" y="348" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#e3b341">aproximado, en binario</text>
  <text x="630" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">0.5f</text>
  <text x="750" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#3fb950">toFloat()</text>
  <rect x="40" y="372" width="820" height="40" rx="8" fill="#161b22" stroke="#7f52ff" stroke-width="2"/>
  <text x="56" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="start" fill="#a98bff">Double</text>
  <rect x="130" y="384" width="160" height="16" rx="8" fill="#58a6ff" stroke="none" stroke-width="1"/>
  <text x="300" y="398" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#8b949e">64 bits</text>
  <text x="380" y="398" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#e3b341">aproximado, en binario</text>
  <text x="630" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#f0f6fc">12.5</text>
  <text x="750" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" fill="#3fb950">toDouble()</text>
  <text x="450" y="446" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#8b949e">En morado, los de uso habitual. Kotlin nunca convierte solo: val l: Long = units no compila.</text>
</svg>
